<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Applies the remembered theme before first paint, so the page does not flash
			// the default theme while the SPA boots. The key must match THEME_STORAGE_KEY
			// in src/lib/theme/theme.ts. The value is only shape-checked here; the app
			// validates it against the canonical theme list once it hydrates, and DaisyUI
			// ignores an unknown data-theme in the meantime.
			(function () {
				var theme;
				try {
					theme = localStorage.getItem('hoard.theme');
				} catch (error) {
					// Site data is blocked; fall through to the system preference.
				}
				if (!theme || !/^[a-z]+$/.test(theme)) {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
